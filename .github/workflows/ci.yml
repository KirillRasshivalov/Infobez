name: CI Security Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: SAST — SpotBugs
        run: mvn -B spotbugs:spotbugs

      - name: SCA — OWASP Dependency-Check
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Show reports
        if: always()
        run: ls -la target/*.json || true

      - name: Pretty-print JSON reports
        if: always()
        run: bash scripts/pretty-json-reports.sh

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sast-spotbugs
          path: target/spotbugsSarif.json
          if-no-files-found: error

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sca-dependency-check
          path: target/dependency-check-report.json
          if-no-files-found: error
