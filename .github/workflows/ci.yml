name: CI Security Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: SAST — SpotBugs
        run: mvn -B spotbugs:spotbugs

      - name: SCA — OWASP Dependency-Check
        run: |
          set -eux
          mvn -B org.owasp:dependency-check-maven:check \
            -DautoUpdate=false \
            -Dformat=JSON \
            -DprettyPrint=true \
            -DfailOnError=false \
            -DoutputDirectory="${PWD}/target"
          echo "=== reports after SCA ==="
          find . -name 'dependency-check-report*' -print -ls || true
          ls -la target || true
          if [ ! -f target/dependency-check-report.json ]; then
            FOUND="$(find . -name 'dependency-check-report.json' | head -n 1 || true)"
            if [ -n "${FOUND}" ]; then
              cp "${FOUND}" target/dependency-check-report.json
            fi
          fi
          test -f target/dependency-check-report.json

      - name: Pretty-print JSON reports
        if: always()
        run: bash scripts/pretty-json-reports.sh

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sast-spotbugs
          path: target/spotbugsSarif.json
          if-no-files-found: error

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sca-dependency-check
          path: target/dependency-check-report.json
          if-no-files-found: error
