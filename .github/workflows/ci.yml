name: CI Security Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: SAST — SpotBugs
        run: mvn -B spotbugs:spotbugs

      - name: SCA — OSV Scanner
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          mkdir -p target
          ./osv-scanner scan --format json --output-file target/sca-report.json ./ || true
          test -s target/sca-report.json

      - name: Upload SAST report
        uses: actions/upload-artifact@v6
        with:
          name: sast-spotbugs
          path: target/spotbugsSarif.json

      - name: Upload SCA report
        uses: actions/upload-artifact@v6
        with:
          name: sca-report
          path: target/sca-report.json
